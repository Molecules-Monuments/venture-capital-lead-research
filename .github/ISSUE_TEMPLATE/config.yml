# SPDX-License-Identifier: Apache-2.0
# Blank issues are disabled on purpose. The three forms beside this file ask
# for the version, the applied migration set, the lane, and the command that
# shows the problem — the things a maintainer needs before a report can be
# acted on at all. A blank issue reliably omits them.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability privately
    url: https://github.com/Molecules-Monuments/venture-capital-lead-research/security/advisories/new
    about: >-
      Do not open a public issue for a security problem. Report it through
      GitHub Private Vulnerability Reporting on the Security tab: that keeps
      the report, the fix, and the advisory together and does not disclose the
      issue before a patch exists. Read SECURITY.md first — it states what is
      in scope, what is deliberately out of scope, and what to include.
  - name: Contributing, and the sign-off every commit needs
    url: https://github.com/Molecules-Monuments/venture-capital-lead-research/blob/main/CONTRIBUTING.md
    about: >-
      How to propose a change, which gates a pull request has to pass on your
      own machine before it is opened, and the Developer Certificate of Origin
      sign-off that every commit carries. Read this before opening a pull
      request, and ask contribution questions here rather than as an issue.
