# SPDX-License-Identifier: Apache-2.0
name: vc-lead-research-v3

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394}
    restart: unless-stopped
    environment:
      POSTGRES_DB: openclaw
      POSTGRES_USER: openclaw_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      PGDATA: /var/lib/postgresql/data/pgdata
      # initdb's default pg_hba trusts loopback TCP ahead of the appended
      # scram rule, which defeats the negative credential proof in
      # migrations/000_roles.sh. Password auth must hold on every TCP path.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_owner_password
      - openclaw_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/000_roles.sh:/docker-entrypoint-initdb.d/000_roles.sh:ro
    healthcheck:
      # Probe over TCP, not the Unix socket. The official entrypoint runs
      # /docker-entrypoint-initdb.d (including 000_roles.sh, which creates the
      # runtime role) against a temporary server started with
      # `listen_addresses=''` — socket-reachable but with no TCP listener. A
      # socket probe therefore reports healthy mid-initialisation, so
      # `service_healthy` and `up --wait` release the gateway and
      # rotate_runtime_role.sh before the role exists and before TCP is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U openclaw_owner -d openclaw"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    pids_limit: 256
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: ${POSTGRES_LOG_MAX_SIZE:-10m}
        max-file: ${POSTGRES_LOG_MAX_FILES:-5}

  openclaw-state-init:
    image: vc-lead-research:3.0.1
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        umask 077
        test -f /run/openclaw-source/openclaw.json
        test ! -L /run/openclaw-source/openclaw.json
        install -m 0400 -o node -g node /run/openclaw-source/openclaw.json /runtime-config/.openclaw.json.tmp
        jq -e 'type == "object" and .gateway.auth.mode == "token" and .commands.config == false and .commands.plugins == false' /runtime-config/.openclaw.json.tmp >/dev/null
        mv -f /runtime-config/.openclaw.json.tmp /runtime-config/openclaw.json
        test -f /runtime-config/openclaw.json
        test ! -L /runtime-config/openclaw.json
        cmp -s /run/openclaw-source/openclaw.json /runtime-config/openclaw.json
        stat -c '%U:%G:%a' /runtime-config/openclaw.json | grep -qx 'node:node:400'
        # 2026.8.1 moved exec approvals out of this file and into
        # state/openclaw.sqlite#exec_approvals_config, and now refuses every
        # approvals read *and* write while the legacy JSON — or the
        # ".doctor-importing" claim file beside it — merely exists
        # (assertNoPendingLegacyExecApprovals, upstream
        # dist/exec-approvals-generated-migration-CYtB4mAB.js). The remedy that
        # error names, `openclaw doctor --fix`, exits 1 and imports nothing, so
        # this lane clears both paths itself and re-seeds the reviewed policy
        # into SQLite below. The reviewed seed stays at /opt/openclaw-seed in the
        # read-only image: nothing this lane leaves in the state volume can
        # re-arm that gate.
        # Symlink checks precede the removal, and are repeated after the seeding:
        # upstream probes with lstat(), so a dangling link reads as "present" to
        # the runtime while `test -e` reads it as absent. `rm -f` unlinks the
        # link itself, never its target, and `test ! -L` on an absent path exits
        # 0, so a first-ever init still passes. The state/ check guards the
        # `chown -R` below, which would otherwise follow a planted link.
        test ! -L /home/node/.openclaw/exec-approvals.json
        test ! -L /home/node/.openclaw/exec-approvals.json.doctor-importing
        test ! -L /home/node/.openclaw/state
        rm -f /home/node/.openclaw/exec-approvals.json /home/node/.openclaw/exec-approvals.json.doctor-importing
        # Both checks precede the install, as in the exec-approvals lane above:
        # install -d is satisfied by a symlink to an existing directory and
        # follows it to chown and chmod the target. While these two lines sat
        # after the install, a link planted in the writable state volume was
        # still caught — the init exits non-zero and the gateway never starts —
        # but only after this root lane had already handed the attacker-chosen
        # directory to node:node 0700 and created inbound/ inside it (measured
        # in the shipped image against /runtime-config/victim, root:root 755
        # before the run). `test ! -L` on an absent path exits 0, so a
        # first-ever init still creates both directories.
        test ! -L /home/node/.openclaw/media
        test ! -L /home/node/.openclaw/media/inbound
        install -d -m 0700 -o node -g node /home/node/.openclaw/media /home/node/.openclaw/media/inbound
        # Bounded retry: three attempts, two 2-second pauses. An intermittent
        # "SQLite read-only worker exited unsuccessfully" was seen twice under
        # concurrent host load and could not be reproduced in 60 controlled runs,
        # so the cause is not pinned. depends_on: service_completed_successfully
        # turns one such flake into a failed stack start, and `approvals set`
        # replaces the row outright, so re-running it is idempotent (verified,
        # 5/5 consecutive runs). After the third attempt the lane still fails
        # closed rather than letting the gateway start unseeded.
        openclaw approvals set --file /opt/openclaw-seed/exec-approvals.json ||
          { sleep 2; openclaw approvals set --file /opt/openclaw-seed/exec-approvals.json; } ||
          { sleep 2; openclaw approvals set --file /opt/openclaw-seed/exec-approvals.json; }
        test ! -e /home/node/.openclaw/exec-approvals.json
        test ! -L /home/node/.openclaw/exec-approvals.json
        test ! -e /home/node/.openclaw/exec-approvals.json.doctor-importing
        test ! -L /home/node/.openclaw/exec-approvals.json.doctor-importing
        # The reviewed policy now lives in SQLite, so the assertion reads the
        # store through the CLI, not a file. `exists` and `path` together prove
        # the write landed in the state volume rather than in a container-local
        # HOME, so a wrong-target write can no longer exit 0. The projection
        # drops `source`: the store normalises provenance away on read, so
        # pinning it here would make the assertion unsatisfiable. `hash` is not
        # pinned either — it covers a socket token minted per state directory,
        # so it differs between deployments.
        openclaw approvals get --json >/tmp/approvals-get.json
        jq -e '.exists == true and .path == "/home/node/.openclaw/state/openclaw.sqlite#exec_approvals_config" and .file.version == 1 and .file.defaults.security == "deny" and .file.defaults.ask == "off" and .file.defaults.askFallback == "deny" and .file.defaults.autoAllowSkills == false and (.file.agents | keys == ["data-steward"]) and .file.agents["data-steward"].security == "allowlist" and .file.agents["data-steward"].ask == "off" and .file.agents["data-steward"].askFallback == "deny" and .file.agents["data-steward"].autoAllowSkills == false and (.file.agents["data-steward"].allowlist | length == 2) and ([.file.agents["data-steward"].allowlist[] | {id,pattern}] | sort_by(.id) == ([{"id":"2DC7C1B8-73D4-42D3-9B6F-CA3FAE54E070","pattern":"/workspaces/vc-chief/vc/bin/agent/vcops"},{"id":"C62E453F-6D6C-4E78-85CE-BB139A57978D","pattern":"/workspaces/vc-chief/vc/bin/agent/vcrun"}] | sort_by(.id)))' /tmp/approvals-get.json >/dev/null
        rm -f /tmp/approvals-get.json
        # This lane runs as root, so the state directory and the openclaw.sqlite
        # it creates come out root:root and the node gateway then dies with
        # EACCES on openclaw.sqlite-wal. setpriv cannot pre-drop to node here:
        # cap_drop ALL makes its setresuid fail with EPERM. The chown runs last
        # so that anything the two commands above created is covered.
        chown -R node:node /home/node/.openclaw/state
    environment:
      # Without these two the CLI resolves HOME=/root and no state directory,
      # and under this lane's read_only rootfs `approvals set` then dies with
      # "ENOENT: no such file or directory, mkdir '/root/.openclaw/state'" and
      # exit 1, so this service fails and the gateway — which waits on
      # service_completed_successfully — never starts (measured against
      # vc-lead-research:3.0.1). They are also what makes /home/node/.cache
      # below the cache root the runtime actually uses.
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      HOME: /home/node
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-runtime-config:/runtime-config
    configs:
      - source: openclaw_runtime_config
        target: /run/openclaw-source/openclaw.json
    read_only: true
    # 8.1 stages private SQLite snapshots under $HOME/.cache and aborts when it
    # cannot create that directory, which read_only makes impossible without a
    # writable mount (measured: run 1 succeeds, runs 2 and 3 die with "Unable to
    # create fallback OpenClaw temp dir: /home/node/.cache/openclaw-0"; 3/3 clean
    # with this mount). The cap is sized to hold a copy of state/openclaw.sqlite,
    # which upstream stages here with sqlite.backup(); the mount is normally
    # empty and its pages are charged to mem_limit, so raise both together if the
    # state database ever approaches it.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /home/node/.cache:rw,noexec,nosuid,size=64m
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    pids_limit: 32
    # 64m OOM-kills the approvals CLI with a completely empty log, and 96m
    # still OOM-kills it; 128m is the measured floor. 256m is twice the floor.
    mem_limit: ${OPENCLAW_INIT_MEMORY_LIMIT:-256m}
    cpus: ${OPENCLAW_INIT_CPU_LIMIT:-0.25}
    logging:
      driver: json-file
      options:
        max-size: ${OPENCLAW_INIT_LOG_MAX_SIZE:-1m}
        max-file: ${OPENCLAW_INIT_LOG_MAX_FILES:-1}

  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.8.1@sha256:e7849cb6c1ef1ead39ab4be7d85edb2df89611f486e283284c7cf35ce39a20d4}
    image: vc-lead-research:3.0.1
    user: node
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      openclaw-state-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw-config/openclaw.json
      LOBSTER_STATE_DIR: /home/node/.openclaw/lobster/state
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VC_CUSTOM_API_KEY: ${VC_CUSTOM_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      CRUNCHBASE_API_KEY: ${CRUNCHBASE_API_KEY:-}
      PITCHBOOK_API_KEY: ${PITCHBOOK_API_KEY:-}
      DEALROOM_API_KEY: ${DEALROOM_API_KEY:-}
      VC_PRIMARY_MODEL: ${VC_PRIMARY_MODEL:-openai/gpt-5.6-sol}
      VC_FAST_MODEL: ${VC_FAST_MODEL:-openai/gpt-5.6-sol}
      VCOPS_INBOX_ROOT: /inbox
      VCOPS_MEDIA_ROOT: /home/node/.openclaw/media/inbound
      VCOPS_QUARANTINE_ROOT: /quarantine
      VCOPS_STATE_ROOT: /home/node/.openclaw/vcops
      VC_TRUSTED_CONTEXT_KEY_FILE: /run/secrets/vc_trusted_context_key
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      MSTEAMS_APP_ID: ${MSTEAMS_APP_ID:-}
      MSTEAMS_APP_PASSWORD: ${MSTEAMS_APP_PASSWORD:-}
      MSTEAMS_TENANT_ID: ${MSTEAMS_TENANT_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    secrets:
      - openclaw_db_password
      - vcops_approval_pepper
      - vc_trusted_context_key
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "${OPENCLAW_HOST:-127.0.0.1}:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${MSTEAMS_WEBHOOK_HOST:-127.0.0.1}:${MSTEAMS_WEBHOOK_PORT:-3978}:3978"
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-runtime-config:/home/node/.openclaw-config:ro
      - ./inbox:/inbox:ro
      - vc-quarantine:/quarantine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      # 8.1 stages private SQLite snapshots under $HOME/.cache. Without this
      # mount the gateway never starts under read_only: it exits 1 with "Unable
      # to create fallback OpenClaw temp dir: /home/node/.cache/openclaw-1000"
      # before it has read any config, where 7.1 in the same posture gets past
      # that point (both measured). Sized to hold a copy of state/openclaw.sqlite
      # and charged to mem_limit; the mount is normally empty.
      # uid/gid/mode are load-bearing: this service runs as `node` (uid 1000) and a
      # tmpfs defaults to root:root 0755, so without them the runtime cannot create
      # /home/node/.cache/openclaw-1000 and the gateway aborts on start.
      - /home/node/.cache:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700
    networks: [backend, egress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18789/readyz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 384
    mem_limit: ${OPENCLAW_GATEWAY_MEMORY_LIMIT:-2g}
    cpus: ${OPENCLAW_GATEWAY_CPU_LIMIT:-2.0}
    logging:
      driver: json-file
      options:
        max-size: ${OPENCLAW_GATEWAY_LOG_MAX_SIZE:-10m}
        max-file: ${OPENCLAW_GATEWAY_LOG_MAX_FILES:-5}

  openclaw-cli:
    profiles: ["tools"]
    image: vc-lead-research:3.0.1
    user: node
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw-config/openclaw.json
      LOBSTER_STATE_DIR: /home/node/.openclaw/lobster/state
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VC_CUSTOM_API_KEY: ${VC_CUSTOM_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      CRUNCHBASE_API_KEY: ${CRUNCHBASE_API_KEY:-}
      PITCHBOOK_API_KEY: ${PITCHBOOK_API_KEY:-}
      DEALROOM_API_KEY: ${DEALROOM_API_KEY:-}
      VC_PRIMARY_MODEL: ${VC_PRIMARY_MODEL:-openai/gpt-5.6-sol}
      VC_FAST_MODEL: ${VC_FAST_MODEL:-openai/gpt-5.6-sol}
      VCOPS_INBOX_ROOT: /inbox
      VCOPS_MEDIA_ROOT: /home/node/.openclaw/media/inbound
      VCOPS_QUARANTINE_ROOT: /quarantine
      VCOPS_STATE_ROOT: /home/node/.openclaw/vcops
      VC_TRUSTED_CONTEXT_KEY_FILE: /run/secrets/vc_trusted_context_key
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      MSTEAMS_APP_ID: ${MSTEAMS_APP_ID:-}
      MSTEAMS_APP_PASSWORD: ${MSTEAMS_APP_PASSWORD:-}
      MSTEAMS_TENANT_ID: ${MSTEAMS_TENANT_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    secrets:
      - openclaw_db_password
      - vcops_approval_pepper
      - vc_trusted_context_key
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-runtime-config:/home/node/.openclaw-config:ro
      - ./inbox:/inbox:ro
      - vc-quarantine:/quarantine
    read_only: true
    # Same 8.1 SQLite snapshot staging root as the other two services; without a
    # writable /home/node/.cache every CLI invocation under read_only can abort
    # with "Unable to create fallback OpenClaw temp dir".
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      # Same ownership requirement as the gateway: this service also runs as
      # `node` (uid 1000), and a tmpfs defaults to root:root 0755.
      - /home/node/.cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    networks: [backend, egress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: ${OPENCLAW_CLI_MEMORY_LIMIT:-1g}
    cpus: ${OPENCLAW_CLI_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: ${OPENCLAW_CLI_LOG_MAX_SIZE:-5m}
        max-file: ${OPENCLAW_CLI_LOG_MAX_FILES:-2}
    entrypoint: ["node", "dist/index.js"]

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres-data:
  openclaw-state:
  openclaw-runtime-config:
    name: ${OPENCLAW_RUNTIME_CONFIG_VOLUME:-vc-lead-research-v3_runtime-config}
  vc-quarantine:
    name: ${VC_QUARANTINE_VOLUME:-vc-lead-research-v3_vc-quarantine}

configs:
  openclaw_runtime_config:
    file: ./config/runtime/openclaw.json

# File-sourced secrets: environment-sourced secrets cannot be injected into
# read-only services (Compose materializes them by writing into the container
# filesystem; `file` secrets bind-mount instead). scripts/render_channel_config.py
# materializes these files from .env on every lifecycle path as mode-0444
# inside a mode-0700 directory: the unprivileged container users must read the
# bind-mounted files, so confidentiality comes from the directory boundary.
secrets:
  postgres_owner_password:
    file: ./config/runtime/secrets/postgres_owner_password
  openclaw_db_password:
    file: ./config/runtime/secrets/openclaw_db_password
  vcops_approval_pepper:
    file: ./config/runtime/secrets/vcops_approval_pepper
  vc_trusted_context_key:
    file: ./config/runtime/secrets/vc_trusted_context_key
